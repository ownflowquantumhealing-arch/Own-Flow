<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Fat Loss Support — Own Flow Quantum Healing</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #1a2744;
  --navy-deep: #111b35;
  --navy-mid: #243058;
  --gold: #c9a96e;
  --gold-light: #e8cc99;
  --gold-dim: rgba(201,169,110,0.3);
  --cream: #f5f0e8;
  --cream-dark: #ede5d8;
  --white: #fdfaf6;
  --text: #3a4060;
  --text-light: #6a7090;
}
html { scroll-behavior: smooth; }
body { background: var(--white); font-family: 'Jost', sans-serif; color: var(--navy); line-height: 1.6; }

nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background: rgba(17,27,53,0.97); backdrop-filter: blur(12px);
  padding: 16px 40px; display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid rgba(201,169,110,0.15);
}
.nav-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.nav-logo img { height: 40px; width: auto; }
.nav-logo-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 300; color: var(--white); letter-spacing: 0.05em; }
.nav-logo-sub { font-size: 8px; letter-spacing: 0.25em; color: var(--gold); text-transform: uppercase; display: block; margin-top: 1px; }
.nav-cta { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 9px 24px; font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; text-decoration: none; transition: all 0.3s; }
.nav-cta:hover { background: var(--gold); color: var(--navy); }

.hero {
  min-height: 100vh;
  background: linear-gradient(160deg, var(--navy-deep) 0%, var(--navy-mid) 55%, #3a4a7a 100%);
  display: flex; align-items: center; position: relative; overflow: hidden; padding: 120px 40px 80px;
}
.hero::before { content: ''; position: absolute; top: -100px; right: -100px; width: 600px; height: 600px; border-radius: 50%; border: 1px solid rgba(201,169,110,0.08); }
.hero::after { content: ''; position: absolute; bottom: -150px; left: -100px; width: 500px; height: 500px; border-radius: 50%; border: 1px solid rgba(201,169,110,0.06); }
.hero-inner { max-width: 860px; margin: 0 auto; position: relative; z-index: 2; }
.hero-logo { display: block; height: 90px; width: auto; margin-bottom: 32px; }
.hero-tag { display: inline-block; border: 1px solid rgba(201,169,110,0.4); color: var(--gold); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; padding: 7px 18px; margin-bottom: 28px; }
.hero h1 { font-family: 'Cormorant Garamond', serif; font-size: clamp(40px, 6vw, 68px); font-weight: 300; color: var(--white); line-height: 1.15; margin-bottom: 24px; }
.hero h1 em { font-style: italic; color: var(--gold-light); }
.hero-sub { font-size: 16px; font-weight: 300; color: rgba(255,255,255,0.72); max-width: 580px; line-height: 1.75; margin-bottom: 44px; }
.hero-buttons { display: flex; gap: 16px; flex-wrap: wrap; }
.btn-primary { background: var(--gold); color: var(--navy-deep); padding: 16px 36px; font-size: 12px; font-weight: 400; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; display: inline-block; transition: all 0.3s; }
.btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
.btn-secondary { border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.85); padding: 16px 36px; font-size: 12px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; display: inline-block; transition: all 0.3s; }
.btn-secondary:hover { border-color: var(--gold); color: var(--gold); }

.promo-strip { background: var(--gold); padding: 14px 40px; text-align: center; }
.promo-strip p { font-size: 12px; font-weight: 400; letter-spacing: 0.15em; color: var(--navy-deep); text-transform: uppercase; }

section { padding: 80px 40px; }
.section-inner { max-width: 860px; margin: 0 auto; }
.section-label { font-size: 10px; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(30px, 4vw, 44px); font-weight: 300; color: var(--navy); line-height: 1.25; margin-bottom: 20px; }
.section-title em { font-style: italic; color: var(--gold); }
.section-body { font-size: 15px; font-weight: 300; color: var(--text); line-height: 1.8; max-width: 640px; }

.missing-layer { background: var(--cream); }
.missing-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 40px; }
.missing-card { background: var(--white); padding: 28px; border-top: 2px solid var(--gold); }
.missing-card h3 { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--navy); margin-bottom: 12px; }
.missing-card p { font-size: 13.5px; font-weight: 300; color: var(--text); line-height: 1.7; }
.impact-list { list-style: none; margin-top: 12px; }
.impact-list li { font-size: 13px; font-weight: 300; color: var(--text); padding: 5px 0; padding-left: 18px; position: relative; border-bottom: 1px solid rgba(201,169,110,0.15); }
.impact-list li:last-child { border-bottom: none; }
.impact-list li::before { content: '—'; position: absolute; left: 0; color: var(--gold); }

.how-section { background: var(--white); }
.tools-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 40px; }
.tool-card { border: 1px solid var(--gold-dim); padding: 28px 24px; position: relative; }
.tool-number { font-family: 'Cormorant Garamond', serif; font-size: 42px; font-weight: 300; color: rgba(201,169,110,0.2); position: absolute; top: 12px; right: 18px; line-height: 1; }
.tool-tag { font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }
.tool-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--navy); margin-bottom: 10px; line-height: 1.3; }
.tool-desc { font-size: 12.5px; font-weight: 300; color: var(--text); line-height: 1.65; }

.levels-section { background: var(--cream); }
.level-cards { display: flex; flex-direction: column; gap: 16px; margin-top: 40px; }
.level-card { background: var(--white); border: 1px solid var(--gold-dim); display: grid; grid-template-columns: 220px 1fr auto; overflow: hidden; transition: box-shadow 0.3s; }
.level-card:hover { box-shadow: 0 8px 40px rgba(26,39,68,0.1); }
.level-card.featured { border-color: var(--gold); }
.level-left { background: var(--navy); padding: 28px 24px; display: flex; flex-direction: column; justify-content: center; }
.level-num { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.level-name { font-family: 'Cormorant Garamond', serif; font-size: 20px; font-weight: 400; color: var(--white); line-height: 1.3; }
.level-tag { display: inline-block; background: var(--gold); color: var(--navy-deep); font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; padding: 3px 8px; margin-top: 8px; width: fit-content; }
.level-middle { padding: 28px; border-left: 1px solid var(--gold-dim); }
.level-includes { list-style: none; }
.level-includes li { font-size: 13px; font-weight: 300; color: var(--text); padding: 5px 0; padding-left: 18px; position: relative; border-bottom: 1px solid rgba(201,169,110,0.12); }
.level-includes li:last-child { border-bottom: none; }
.level-includes li::before { content: '—'; position: absolute; left: 0; color: var(--gold); font-size: 11px; }
.level-right { padding: 28px; border-left: 1px solid var(--gold-dim); display: flex; flex-direction: column; align-items: flex-end; justify-content: center; min-width: 160px; }
.level-price { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--navy); line-height: 1; }
.level-currency { font-size: 11px; font-weight: 300; letter-spacing: 0.15em; color: var(--gold); text-transform: uppercase; margin-top: 4px; display: block; text-align: right; }
.level-cta { display: inline-block; background: var(--navy); color: var(--gold); padding: 10px 20px; font-size: 10px; font-weight: 300; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; margin-top: 16px; transition: all 0.3s; white-space: nowrap; }
.level-cta:hover { background: var(--gold); color: var(--navy-deep); }
.featured .level-cta { background: var(--gold); color: var(--navy-deep); }
.featured .level-cta:hover { background: var(--gold-light); }

.promo-box { background: var(--navy); padding: 32px 36px; margin-top: 28px; position: relative; overflow: hidden; }
.promo-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(to right, transparent, var(--gold), transparent); }
.promo-box-label { font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
.promo-box-items { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.promo-box-item { display: flex; gap: 14px; align-items: flex-start; }
.promo-box-item-icon { color: var(--gold); font-size: 18px; flex-shrink: 0; margin-top: 2px; }
.promo-box-item-text strong { display: block; font-size: 14px; font-weight: 400; color: var(--gold-light); margin-bottom: 4px; font-family: 'Cormorant Garamond', serif; }
.promo-box-item-text p { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.7); line-height: 1.5; }

.outcomes-section { background: var(--navy-deep); }
.outcomes-section .section-title { color: var(--white); }
.outcomes-section .section-label { color: var(--gold); }
.outcomes-section .section-body { color: rgba(255,255,255,0.65); }
.outcomes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 40px; }
.outcome-card { border: 1px solid rgba(201,169,110,0.2); padding: 24px; display: flex; align-items: flex-start; gap: 16px; }
.outcome-num { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; color: var(--gold); opacity: 0.5; line-height: 1; flex-shrink: 0; }
.outcome-text { font-size: 13px; font-weight: 300; color: rgba(255,255,255,0.8); line-height: 1.6; }

.about-section { background: var(--cream); }
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; margin-top: 40px; }
.about-text p { font-size: 14.5px; font-weight: 300; color: var(--text); line-height: 1.8; margin-bottom: 16px; }
.credentials { list-style: none; margin-top: 24px; }
.credentials li { font-size: 12.5px; font-weight: 300; color: var(--text-light); padding: 8px 0; border-bottom: 1px solid var(--gold-dim); display: flex; align-items: center; gap: 10px; }
.credentials li::before { content: '✦'; color: var(--gold); font-size: 8px; flex-shrink: 0; }
.about-visual { background: var(--navy); padding: 40px; display: flex; flex-direction: column; gap: 16px; }
.about-visual-quote { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; font-style: italic; color: var(--white); line-height: 1.5; border-left: 2px solid var(--gold); padding-left: 20px; }
.about-visual-name { font-size: 13px; font-weight: 300; color: var(--gold); letter-spacing: 0.1em; margin-top: 8px; }

.book-section { background: var(--navy-deep); text-align: center; position: relative; overflow: hidden; }
.book-section::before { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 600px; height: 600px; border-radius: 50%; border: 1px solid rgba(201,169,110,0.06); }
.book-section .section-inner { position: relative; z-index: 2; }
.book-section .section-label { color: var(--gold); }
.book-section .section-title { color: var(--white); }
.book-section .section-body { color: rgba(255,255,255,0.65); margin: 0 auto 36px; text-align: center; }
.book-options { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
.contact-row { display: flex; gap: 40px; justify-content: center; flex-wrap: wrap; margin-top: 32px; padding-top: 32px; border-top: 1px solid rgba(201,169,110,0.2); }
.contact-item { font-size: 12px; font-weight: 300; color: rgba(255,255,255,0.6); display: flex; align-items: center; gap: 8px; }
.contact-item span { color: var(--gold); }

footer { background: #0a1020; padding: 24px 40px; display: flex; justify-content: space-between; align-items: center; }
.footer-brand { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 300; color: rgba(255,255,255,0.5); letter-spacing: 0.05em; }
.footer-note { font-size: 10px; font-weight: 300; color: rgba(255,255,255,0.3); letter-spacing: 0.05em; }

.gold-divider { display: flex; align-items: center; gap: 16px; margin: 36px 0; }
.gold-divider-line { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--gold-dim), transparent); }
.gold-divider-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--gold); opacity: 0.5; }

@media (max-width: 768px) {
  nav { padding: 14px 20px; }
  section { padding: 60px 20px; }
  .hero { padding: 100px 20px 60px; }
  .missing-grid { grid-template-columns: 1fr; }
  .tools-grid { grid-template-columns: 1fr; }
  .level-card { grid-template-columns: 1fr; }
  .level-left { padding: 20px; }
  .level-right { border-left: none; border-top: 1px solid var(--gold-dim); padding: 20px; align-items: flex-start; }
  .outcomes-grid { grid-template-columns: 1fr 1fr; }
  .about-grid { grid-template-columns: 1fr; }
  .promo-box-items { grid-template-columns: 1fr; }
  footer { flex-direction: column; gap: 8px; text-align: center; }
}
</style>
</head>
<body>
